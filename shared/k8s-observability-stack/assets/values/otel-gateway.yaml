# OpenTelemetry collector, gateway (Deployment x2), `opentelemetry-collector` chart.
#
# Tail sampling, batching and egress to Tempo and Loki. Headless Service, so the agents'
# load_balancing exporter resolves individual pods (invariant 15). A starting shape, not a version
# source. Placeholders look like <this>.

mode: deployment
replicaCount: 2
fullnameOverride: otel-gateway

image:
  repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-k8s
command:
  name: otelcol-k8s

service:
  clusterIP: None

ports:
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false
  metrics:
    enabled: true

# Invariant 10.
rollout:
  strategy: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1
affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: opentelemetry-collector
            app.kubernetes.io/instance: <release-name>
        topologyKey: kubernetes.io/hostname

config:
  receivers:
    jaeger: null
    zipkin: null
    prometheus: null
  processors:
    batch:
      send_batch_size: 2048
      timeout: 5s
    # Keep every error and every slow trace, and a baseline sample of the rest.
    tail_sampling:
      decision_wait: 10s
      num_traces: 50000
      policies:
        - name: errors
          type: status_code
          status_code:
            status_codes:
              - ERROR
        - name: slow
          type: latency
          latency:
            threshold_ms: 2000
        - name: baseline
          type: probabilistic
          probabilistic:
            sampling_percentage: 10
  exporters:
    debug: null
    otlp_grpc/tempo:
      endpoint: tempo.<tempo-namespace>.svc.cluster.local:4317
      tls:
        insecure: true
    # Loki's native OTLP endpoint; the exporter appends /v1/logs.
    otlp_http/loki:
      # nosemgrep: DS137138 -- in-cluster HTTP; OTel collector sends logs to Loki inside the cluster network
      endpoint: http://loki-write.<loki-namespace>.svc.cluster.local:3100/otlp
  service:
    pipelines:
      traces:
        receivers:
          - otlp
        processors:
          - memory_limiter
          - tail_sampling
          - batch
        exporters:
          - otlp_grpc/tempo
      logs:
        receivers:
          - otlp
        processors:
          - memory_limiter
          - batch
        exporters:
          - otlp_http/loki
      metrics: null

serviceMonitor:
  enabled: true

resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    memory: 1Gi
