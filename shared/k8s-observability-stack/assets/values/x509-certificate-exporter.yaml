# x509-certificate-exporter values (enix chart): one Deployment for certificates in Secrets.
# A starting shape, not a version source. Placeholders look like <this>.
#
# No host-path DaemonSets. The chart mounts each watched file's parent directory (verified on 4.2.0),
# and on self-managed control planes those directories hold CA and client private keys and admin
# kubeconfigs. Check API server certificates over TLS instead: manifests/apiserver-tls-probe.yaml.
#
# The Secrets exporter reads Secrets cluster-wide: RBAC cannot filter by Secret type, and the chart
# renders a ClusterRole even with includeNamespaces, which filters inside the exporter. Say so in the
# output README, and give the pod an ingress policy that admits only Prometheus (architecture.md,
# Network access). Where cert-manager issues every certificate, its own metrics may be enough.
#
# The chart does not set automountServiceAccountToken on the pod. Where a cluster policy defaults it
# to false, the Secrets exporter (which reads Secrets through the API) needs it set to true, for
# example with a Flux postRenderers patch.

secretsExporter:
  enabled: true
  replicas: 1
  secretTypes:
    - type: kubernetes.io/tls
      key: tls.crt
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 150Mi

prometheusServiceMonitor:
  create: true
# Upstream rules: a warning tier (28 days) and a critical tier (14 days). If the root route drops
# warnings, decide deliberately whether the warning tier needs a route; cert-manager's own alerts
# may already cover the certificates it manages.
prometheusRules:
  create: true
  warningDaysLeft: 28
  criticalDaysLeft: 14
