# Loki values (grafana-community `loki` chart) for the reference architecture: simple scalable mode,
# object storage, external memcached, no gateway.
#
# A starting shape, not a version source. Pin the chart version you verified and diff these keys
# against `helm show values`. Simple scalable mode is deprecated in Loki 3.x and removed in 4.0
# (architecture.md). Placeholders look like <this>.

# SimpleScalable is deprecated in Loki 3.x and removed in 4.0; use `distributed` for any chart >= 4.0.
deploymentMode: SimpleScalable

loki:
  # Single tenant. For multi-tenancy set true and send X-Scope-OrgID on push and query.
  auth_enabled: false
  commonConfig:
    replication_factor: 3
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: azure            # azure | s3 | gcs, matching storage.type
        schema: v13
        index:
          prefix: index_
          period: 24h
  # Storage block from references/backends.md for the chosen backend.
  storage:
    type: azure
    bucketNames:
      chunks: <loki-chunks-bucket>
      ruler: <loki-ruler-bucket>
    azure:
      accountName: <account>
      accountKey: ${AZURE_STORAGE_ACCOUNT_KEY}
  # Invariant 7: explicit retention and per-tenant limits.
  limits_config:
    retention_period: 744h
    reject_old_samples: true
    reject_old_samples_max_age: 168h
    ingestion_rate_mb: 8
    ingestion_burst_size_mb: 16
    max_global_streams_per_user: 10000
    per_stream_rate_limit: 3MB
    per_stream_rate_limit_burst: 15MB
    max_query_series: 5000
    allow_structured_metadata: true
    volume_enabled: true
  compactor:
    retention_enabled: true
    delete_request_store: azure        # same value as schemaConfig object_store
  rulerConfig:
    # Every Alertmanager replica through SRV discovery, not one Service (invariant 13).
    alertmanager_url: http://_http-web._tcp.alertmanager-operated.<alertmanager-namespace>.svc.cluster.local  # nosemgrep: DS137138
    enable_alertmanager_discovery: true
  query_range:
    cache_results: true
  analytics:
    reporting_enabled: false

# Credentials from a Secret, expanded into the config (backends.md). The chart already passes
# -config.expand-env=true to every Loki component; confirm that in the rendered args.
defaults:
  extraEnvFrom:
    - secretRef:
        name: loki-objstore

write:
  replicas: 3
  persistence:
    size: 10Gi
    storageClass: <storage-class>
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi

read:
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 2Gi

backend:
  replicas: 2
  persistence:
    volumeClaimsEnabled: true
    size: 10Gi
    storageClass: <storage-class>
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi

# The chart's hard anti-affinity, PodDisruptionBudgets (maxUnavailable 1) and read maxSurge 0 are
# already what invariant 10 requires. Re-check them in the rendered output.

# External memcached (invariant 8): exactly one backend per cache.
memcached:
  enabled: false
chunksCache:
  enabled: true
  addresses: dnssrvnoa+_client._tcp.memcached.<memcached-namespace>.svc.cluster.local
resultsCache:
  enabled: true
  addresses: dnssrvnoa+_client._tcp.memcached.<memcached-namespace>.svc.cluster.local

# Not in the reference architecture. Push goes to loki-write, queries to loki-read.
gateway:
  enabled: false
# The canary and Helm test point at the gateway by default; without it they fail.
lokiCanary:
  enabled: false
test:
  enabled: false

singleBinary:
  replicas: 0
minio:
  enabled: false

monitoring:
  serviceMonitor:
    enabled: true
