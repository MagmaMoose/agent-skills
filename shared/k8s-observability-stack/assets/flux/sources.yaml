# Chart sources for the reference architecture (architecture.md, "Where the charts and images come
# from"). Re-verify each URL during the run. Put these wherever the repository keeps its sources.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community
  namespace: flux-system
spec:
  interval: 1h
  url: https://prometheus-community.github.io/helm-charts
---
# Loki, Tempo and Grafana moved here from grafana/helm-charts in 2026.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: grafana-community
  namespace: flux-system
spec:
  interval: 1h
  url: https://grafana-community.github.io/helm-charts
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: open-telemetry
  namespace: flux-system
spec:
  interval: 1h
  url: https://open-telemetry.github.io/opentelemetry-helm-charts
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: enix
  namespace: flux-system
spec:
  interval: 1h
  url: https://charts.enix.io
---
# OCI: the old charts.deliveryhero.io index is stale.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: deliveryhero
  namespace: flux-system
spec:
  type: oci
  interval: 1h
  url: oci://ghcr.io/deliveryhero/helm-charts
