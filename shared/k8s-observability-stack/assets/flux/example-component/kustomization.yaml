# One directory per component. values.yaml becomes a ConfigMap whose name carries a content hash, and
# kustomizeconfig.yaml rewrites the HelmRelease's valuesFrom to that name, so a values change rolls
# the release.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: <namespace>
resources:
  - helmrelease.yaml
configMapGenerator:
  - name: loki-values
    files:
      - values.yaml
    options:
      annotations:
        # The values contain ${VAR} references meant for Loki's -config.expand-env, not for Flux.
        # Without this, Flux postBuild substitution replaces them with empty strings.
        kustomize.toolkit.fluxcd.io/substitute: disabled
configurations:
  - kustomizeconfig.yaml
