# Every Secret the stack mounts, as External Secrets Operator resources. If the repository uses SOPS,
# produce the same Secret names and keys as encrypted Secrets instead. The Secret names here are the
# ones the other assets expect. Placeholders look like <this>.
#
# Create the upstream secret-store entries BEFORE merging (output.md, Secrets). A missing mounted
# Secret keeps pods from starting.
---
# Thanos wants a whole objstore.yml (backends.md). Rendered from the store with a template.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: thanos-objstore
  namespace: <namespace>
spec:
  refreshInterval: 10m
  secretStoreRef:
    kind: ClusterSecretStore
    name: <secret-store>
  target:
    name: thanos-objstore
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        objstore.yml: |
          type: AZURE
          config:
            storage_account: "{{ .accountName }}"
            storage_account_key: "{{ .accountKey }}"
            container: "<thanos-bucket>"
  data:
    - secretKey: accountName
      remoteRef:
        key: <path>
        property: account-name
    - secretKey: accountKey
      remoteRef:
        key: <path>
        property: account-key
---
# Loki and Tempo read the key from an environment variable (backends.md).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: loki-objstore
  namespace: <loki-namespace>
spec:
  refreshInterval: 10m
  secretStoreRef:
    kind: ClusterSecretStore
    name: <secret-store>
  target:
    name: loki-objstore
    creationPolicy: Owner
  data:
    - secretKey: AZURE_STORAGE_ACCOUNT_KEY
      remoteRef:
        key: <path>
        property: account-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tempo-objstore
  namespace: <namespace>
spec:
  refreshInterval: 10m
  secretStoreRef:
    kind: ClusterSecretStore
    name: <secret-store>
  target:
    name: tempo-objstore
    creationPolicy: Owner
  data:
    - secretKey: AZURE_STORAGE_ACCOUNT_KEY
      remoteRef:
        key: <path>
        property: account-key
---
# Notification sink URL or key, mounted into Alertmanager as /etc/alertmanager/secrets/alertmanager-sink/url.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-sink
  namespace: <namespace>
spec:
  refreshInterval: 10m
  secretStoreRef:
    kind: ClusterSecretStore
    name: <secret-store>
  target:
    name: alertmanager-sink
    creationPolicy: Owner
  data:
    - secretKey: url
      remoteRef:
        key: <path>
        property: value
---
# Heartbeat URL for the Watchdog route (invariant 11).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-heartbeat
  namespace: <namespace>
spec:
  refreshInterval: 10m
  secretStoreRef:
    kind: ClusterSecretStore
    name: <secret-store>
  target:
    name: alertmanager-heartbeat
    creationPolicy: Owner
  data:
    - secretKey: url
      remoteRef:
        key: <path>
        property: value
---
# Grafana database credentials, shared by the CloudNativePG bootstrap and Grafana.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-database
  namespace: <namespace>
spec:
  refreshInterval: 10m
  secretStoreRef:
    kind: ClusterSecretStore
    name: <secret-store>
  target:
    name: grafana-database
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
  data:
    - secretKey: username
      remoteRef:
        key: <path>
        property: username
    - secretKey: password
      remoteRef:
        key: <path>
        property: password
