# Thanos query, store and compactor as raw manifests, for the reference architecture.
# The sidecar and Ruler come from kube-prometheus-stack (values/kube-prometheus-stack.yaml).
#
# A starting shape, not a version source: pin the image you verified and check each flag against that
# version's docs. Placeholders look like <this>. Invariant numbers refer to references/invariants.md.
# The checkov.io/skip annotations are for the template (placeholder tags, no NetworkPolicy): drop each
# one the generated manifest satisfies.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: thanos-query-endpoints
  namespace: <namespace>
data:
  # Invariant 4: DNS SRV against headless Services, so every replica is seen.
  endpoints.yml: |
    endpoints:
      - address: dnssrv+_grpc._tcp.prometheus-thanos-discovery.<namespace>.svc.cluster.local
      - address: dnssrv+_grpc._tcp.thanos-store.<namespace>.svc.cluster.local
      - address: dnssrv+_grpc._tcp.thanos-ruler-operated.<namespace>.svc.cluster.local
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: thanos-store-cache
  namespace: <namespace>
data:
  # max_item_size must not exceed memcached's -I.
  index-cache.yml: |
    type: MEMCACHED
    config:
      addresses:
        - dnssrvnoa+_client._tcp.memcached.<memcached-namespace>.svc.cluster.local
      timeout: 500ms
      max_item_size: 5MiB
  caching-bucket.yml: |
    type: MEMCACHED
    config:
      addresses:
        - dnssrvnoa+_client._tcp.memcached.<memcached-namespace>.svc.cluster.local
      timeout: 500ms
      max_item_size: 5MiB
    chunk_subrange_size: 16000
    max_chunks_get_range_requests: 3
---
# ServiceAccounts for the two components that read and write the bucket. With workload identity
# (IRSA, EKS Pod Identity, Azure or GKE Workload Identity) the role annotation goes here
# (backends.md). They never call the Kubernetes API, so the token is not mounted.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: thanos-store
  namespace: <namespace>
  annotations: {}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: thanos-compactor
  namespace: <namespace>
  annotations: {}
automountServiceAccountToken: false
---
# --- thanos-query: 2 replicas, stateless ------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: thanos-query
  namespace: <namespace>
  labels:
    app.kubernetes.io/name: thanos-query
  annotations:
    checkov.io/skip1: "CKV_K8S_43=Template: the tag is a placeholder; pin the digest when generating"
    checkov.io/skip2: "CKV_K8S_15=Template: pull policy is a cluster decision (registry mirrors, air gap)"
    checkov.io/skip3: "CKV2_K8S_6=Template: NetworkPolicy depends on the CNI; add one where it is enforced"
spec:
  replicas: 2
  # Invariant 10: required anti-affinity, so no surge pod.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: thanos-query
  template:
    metadata:
      labels:
        app.kubernetes.io/name: thanos-query
    spec:
      automountServiceAccountToken: false
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: thanos-query
              topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: thanos-query
          image: quay.io/thanos/thanos:<thanos-version>
          args:
            - query
            - --http-address=0.0.0.0:9090
            - --grpc-address=0.0.0.0:10901
            # Query-time deduplication (invariant 2).
            - --query.replica-label=prometheus_replica
            - --query.replica-label=thanos_ruler_replica
            - --endpoint.sd-config-file=/etc/thanos/endpoints/endpoints.yml
          ports:
            - name: http
              containerPort: 9090
            - name: grpc
              containerPort: 10901
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 2000m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: endpoints
              mountPath: /etc/thanos/endpoints
              readOnly: true
      volumes:
        - name: endpoints
          configMap:
            name: thanos-query-endpoints
---
apiVersion: v1
kind: Service
metadata:
  name: thanos-query
  namespace: <namespace>
  labels:
    app.kubernetes.io/name: thanos-query
spec:
  selector:
    app.kubernetes.io/name: thanos-query
  ports:
    - name: http
      port: 9090
      targetPort: http
    - name: grpc
      port: 10901
      targetPort: grpc
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: thanos-query
  namespace: <namespace>
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: thanos-query
---
# --- thanos-store: 2 replicas, index-header cache on a PV ---------------------------------------
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: thanos-store
  namespace: <namespace>
  labels:
    app.kubernetes.io/name: thanos-store
  annotations:
    checkov.io/skip1: "CKV_K8S_43=Template: the tag is a placeholder; pin the digest when generating"
    checkov.io/skip2: "CKV_K8S_15=Template: pull policy is a cluster decision (registry mirrors, air gap)"
    checkov.io/skip3: "CKV2_K8S_6=Template: NetworkPolicy depends on the CNI; add one where it is enforced"
spec:
  replicas: 2
  serviceName: thanos-store
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: thanos-store
  template:
    metadata:
      labels:
        app.kubernetes.io/name: thanos-store
    spec:
      serviceAccountName: thanos-store
      automountServiceAccountToken: false
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: thanos-store
              topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: thanos-store
          image: quay.io/thanos/thanos:<thanos-version>
          args:
            - store
            - --data-dir=/var/thanos/store
            - --objstore.config-file=/etc/thanos/objstore/objstore.yml
            - --index-cache.config-file=/etc/thanos/cache/index-cache.yml
            - --store.caching-bucket.config-file=/etc/thanos/cache/caching-bucket.yml
            - --grpc-address=0.0.0.0:10901
            - --http-address=0.0.0.0:10902
          ports:
            - name: grpc
              containerPort: 10901
            - name: http
              containerPort: 10902
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 512Mi
            limits:
              cpu: 4000m
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /var/thanos/store
            - name: objstore
              mountPath: /etc/thanos/objstore
              readOnly: true
            - name: cache
              mountPath: /etc/thanos/cache
              readOnly: true
      volumes:
        - name: objstore
          secret:
            secretName: thanos-objstore
        - name: cache
          configMap:
            name: thanos-store-cache
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        storageClassName: <storage-class>
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 50Gi
---
# Headless: thanos-query resolves every store pod through DNS SRV (invariant 4).
apiVersion: v1
kind: Service
metadata:
  name: thanos-store
  namespace: <namespace>
  labels:
    app.kubernetes.io/name: thanos-store
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: thanos-store
  ports:
    - name: grpc
      port: 10901
      targetPort: grpc
    - name: http
      port: 10902
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: thanos-store
  namespace: <namespace>
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: thanos-store
---
# --- thanos-compactor: exactly ONE per bucket (invariant 1). No PDB, no HPA. ---------------------
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: thanos-compactor
  namespace: <namespace>
  labels:
    app.kubernetes.io/name: thanos-compactor
  annotations:
    checkov.io/skip1: "CKV_K8S_43=Template: the tag is a placeholder; pin the digest when generating"
    checkov.io/skip2: "CKV_K8S_15=Template: pull policy is a cluster decision (registry mirrors, air gap)"
    checkov.io/skip3: "CKV2_K8S_6=Template: NetworkPolicy depends on the CNI; add one where it is enforced"
spec:
  replicas: 1
  serviceName: thanos-compactor
  selector:
    matchLabels:
      app.kubernetes.io/name: thanos-compactor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: thanos-compactor
    spec:
      serviceAccountName: thanos-compactor
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: thanos-compactor
          image: quay.io/thanos/thanos:<thanos-version>
          args:
            - compact
            - --wait
            - --wait-interval=5m
            - --data-dir=/var/thanos/compact
            - --objstore.config-file=/etc/thanos/objstore/objstore.yml
            - --http-address=0.0.0.0:10902
            # Retention defaults to 0d, which is forever. Keep 5m and 1h above 10 days.
            - --retention.resolution-raw=30d
            - --retention.resolution-5m=90d
            - --retention.resolution-1h=365d
            # Invariant 2: no --deduplication.replica-label, no vertical compaction.
          ports:
            - name: http
              containerPort: 10902
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 512Mi
            limits:
              cpu: 4000m
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /var/thanos/compact
            - name: objstore
              mountPath: /etc/thanos/objstore
              readOnly: true
      volumes:
        - name: objstore
          secret:
            secretName: thanos-objstore
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        storageClassName: <storage-class>
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            # Scratch for the largest compaction group (storage-model.md).
            storage: 100Gi
---
apiVersion: v1
kind: Service
metadata:
  name: thanos-compactor
  namespace: <namespace>
  labels:
    app.kubernetes.io/name: thanos-compactor
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: thanos-compactor
  ports:
    - name: http
      port: 10902
      targetPort: http
---
# ServiceMonitors. If the CRDs come from a HelmRelease in the same Flux Kustomization, ship these
# through kube-prometheus-stack's extraManifests instead (output.md, CRD ordering).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: thanos
  namespace: <namespace>
spec:
  selector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - thanos-query
          - thanos-store
          - thanos-compactor
  endpoints:
    - port: http
      path: /metrics
